<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Panel Entrenador - GYMFIT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-bg">
<div class="dash">
  <aside class="dash-side">
    <div class="brand"><a class="gf-logo" href="index.html">GYM<span>FIT</span></a></div>
    <div class="user-mini">
      <img src="https://i.pravatar.cc/100?img=12" alt="">
      <div><small class="text-secondary d-block">Entrenador</small><strong id="meName">—</strong></div>
    </div>
    <ul class="menu">
      <li><a class="active" href="#"><i class="bi bi-people-fill"></i> Clientes</a></li>
      <li><a href="#"><i class="bi bi-list-check"></i> Rutinas</a></li>
      <li><a href="#"><i class="bi bi-calendar-event"></i> Calendario</a></li>
      <li><a href="#"><i class="bi bi-chat-dots"></i> Mensajes</a></li>
      <li><a href="#"><i class="bi bi-gear"></i> Configuración</a></li>
    </ul>
    <div class="logout"><a href="#" onclick="logout();return false;"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a></div>
  </aside>

  <main class="dash-main">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
      <div>
        <h3 class="fw-bold mb-1">Mis clientes</h3>
        <small class="text-secondary">Administra y consulta la información de tus clientes</small>
      </div>
      <button class="btn btn-gf" data-bs-toggle="modal" data-bs-target="#modalAdd"><i class="bi bi-plus-lg"></i> Agregar cliente</button>
    </div>

    <div class="gf-card">
      <input id="busqueda" class="form-control mb-3" placeholder="Buscar cliente...">
      <div id="listaClientes"><div class="text-center text-muted py-4">Cargando...</div></div>
    </div>
  </main>
</div>

<!-- Modal: agregar cliente existente -->
<div class="modal fade" id="modalAdd" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light border-secondary">
      <div class="modal-header border-secondary"><h5 class="modal-title">Agregar cliente</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
      <form id="formAdd">
        <div class="modal-body">
          <p class="text-secondary small">Ingresa el email de un cliente registrado para asignarlo a tu lista.</p>
          <input class="form-control" type="email" name="email" placeholder="email@ejemplo.com" required>
        </div>
        <div class="modal-footer border-secondary">
          <button type="button" class="btn btn-gf-outline text-light" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-gf">Agregar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
let CLIENTES = [];

(async () => {
  const u = await requireRole('entrenador');
  if (!u) return;
  document.getElementById('meName').textContent = u.nombre;
  await cargar();
})();

async function cargar(){
  try {
    const r = await api('clientes.php');
    CLIENTES = r.clientes;
    render();
  } catch(e){ toast(e.message, 'error'); }
}

function render(){
  const q = document.getElementById('busqueda').value.toLowerCase();
  const list = CLIENTES.filter(c => c.nombre.toLowerCase().includes(q) || c.email.toLowerCase().includes(q));
  const html = list.length ? list.map((c,i) => `
    <div class="client-row">
      <img src="https://i.pravatar.cc/100?img=${(c.id*7)%70+1}" alt="">
      <div class="meta">
        <strong>${c.nombre}</strong>
        <small>${c.email}</small>
      </div>
      <small class="text-secondary me-3 d-none d-md-block">
        ${c.ultima_rutina ? 'Última rutina: ' + new Date(c.ultima_rutina).toLocaleDateString() : 'Sin rutinas'}
      </small>
      <a href="asignar-rutina.html?cliente=${c.id}" class="btn btn-gf btn-sm">Ver</a>
    </div>`).join('') : '<div class="text-center text-muted py-4">Sin clientes todavía</div>';
  document.getElementById('listaClientes').innerHTML = html;
}

document.getElementById('busqueda').addEventListener('input', render);

document.getElementById('formAdd').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('clientes.php', { method:'POST', body:{ email:e.target.email.value.trim() }});
    toast('Cliente agregado');
    bootstrap.Modal.getInstance(document.getElementById('modalAdd')).hide();
    e.target.reset();
    cargar();
  } catch(err){ toast(err.message, 'error'); }
});
</script>
</body>
</html>
