<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Registro - GYMFIT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="text-center">
      <a href="index.html" class="gf-logo d-inline-block">GYM<span>FIT</span></a>
      <h4 class="mt-3 mb-4 fw-bold">Crear cuenta</h4>
    </div>

    <form id="formReg">
      <div class="mb-3"><input class="form-control" name="nombre" placeholder="Nombre completo" required></div>
      <div class="mb-3"><input class="form-control" type="email" name="email" placeholder="Email" required></div>
      <div class="mb-3"><input class="form-control" type="password" name="password" placeholder="Contraseña (mín. 6)" required minlength="6"></div>
      <div class="mb-3">
        <select class="form-control form-select" name="rol" required>
          <option value="">Selecciona tu rol</option>
          <option value="cliente">Cliente</option>
          <option value="entrenador">Entrenador</option>
        </select>
      </div>
      <button class="btn btn-gf w-100" type="submit" >Registrarme</button>
      
    </form>
    <p class="mt-3 text-center small text-muted">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('formReg').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    try {
      const r = await api('registro.php', { method:'POST', body: {
        nombre:f.nombre.value.trim(), email:f.email.value.trim(),
        password:f.password.value, rol:f.rol.value
      }});
      toast('¡Cuenta creada!');
      setTimeout(() => redirectByRole(r.user), 600);
    } catch(err){ toast(err.message, 'error'); }
  });
</script>
</body>
</html>
