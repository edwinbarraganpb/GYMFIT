<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Progreso de Clientes - GYMFIT</title>
  <meta name="description" content="Reporte de progreso de clientes GYMFIT" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body class="app-bg">
<div class="dash">
  <aside class="dash-side">
    <div class="brand"><a class="gf-logo" href="../index.html">GYM<span>FIT</span></a></div>
    <ul class="menu">
      <li><a href="../panel-entrenador.html"><i class="bi bi-people-fill"></i> Clientes</a></li>
      <li><a class="active" href="clientes.html"><i class="bi bi-graph-up"></i> Progreso</a></li>
      <li><a href="gym.html"><i class="bi bi-bar-chart"></i> Estadísticas</a></li>
    </ul>
    <div class="logout"><a href="#" onclick="logout();return false;"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a></div>
  </aside>

  <main class="dash-main">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div>
        <h3 class="fw-bold mb-1">Progreso de Clientes</h3>
        <small class="text-secondary">Rutinas asignadas por período y cliente</small>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-md-3">
        <div class="gf-card text-center">
          <h2 class="gf-red fw-bold" id="totalRutinas">0</h2>
          <small class="text-secondary">Total rutinas</small>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="gf-card">
          <h6 class="fw-bold mb-3">Rutinas por mes</h6>
          <canvas id="chartRutinasMes" height="250"></canvas>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="gf-card">
          <h6 class="fw-bold mb-3">Rutinas por cliente</h6>
          <canvas id="chartRutinasCliente" height="250"></canvas>
        </div>
      </div>
    </div>

    <div class="gf-card mt-4">
      <h6 class="fw-bold mb-3">Detalle por cliente</h6>
      <div class="table-responsive">
        <table class="table table-dark table-striped table-sm mb-0" id="tablaRutinas">
          <thead>
            <tr>
              <th>Cliente</th>
              <th class="text-center">Rutinas</th>
            </tr>
          </thead>
          <tbody id="tbodyRutinas"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/app.js"></script>
<script>
(async () => {
  const u = await requireRole('entrenador');
  if (!u) return;

  try {
    const data = await api('reportes.php?tipo=clientes');

    new Chart(document.getElementById('chartRutinasMes'), {
      type: 'bar',
      data: {
        labels: data.rutinas_por_mes.map(x => x.mes),
        datasets: [{
          label: 'Rutinas',
          data: data.rutinas_por_mes.map(x => x.total),
          backgroundColor: '#e63946',
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { stepSize: 1 } },
          x: { grid: { display: false } },
        }
      }
    });

    const clientLabels = data.rutinas_por_cliente.map(x => x.nombre);
    const clientValues = data.rutinas_por_cliente.map(x => x.total);

    new Chart(document.getElementById('chartRutinasCliente'), {
      type: 'doughnut',
      data: {
        labels: clientLabels,
        datasets: [{
          data: clientValues,
          backgroundColor: ['#e63946', '#c1121f', '#ff5a66', '#9a031e', '#f0717a', '#d62828'],
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'bottom', labels: { color: '#ccc', boxWidth: 12 } }
        }
      }
    });

    const tbody = document.getElementById('tbodyRutinas');
    data.rutinas_por_cliente.forEach(c => {
      tbody.innerHTML += `<tr><td>${c.nombre}</td><td class="text-center">${c.total}</td></tr>`;
    });
  } catch (e) { toast(e.message, 'error'); }
})();
</script>
</body>
</html>
