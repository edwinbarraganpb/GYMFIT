<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mi rutina - GYMFIT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-bg">
<div class="dash">
  <aside class="dash-side">
    <div class="brand"><a class="gf-logo" href="index.html">GYM<span>FIT</span></a></div>
    <div class="user-mini">
      <img src="https://i.pravatar.cc/100?img=15" alt="">
      <div><small class="text-secondary d-block">Cliente</small><strong id="meName">—</strong></div>
    </div>
    <ul class="menu">
      <li><a class="active" href="#"><i class="bi bi-clipboard-check"></i> Mi rutina</a></li>
      <li><a href="#"><i class="bi bi-graph-up-arrow"></i> Progreso</a></li>
      <li><a href="#"><i class="bi bi-chat-dots"></i> Mensajes</a></li>
      <li><a href="#"><i class="bi bi-person"></i> Perfil</a></li>
    </ul>
    <div class="logout"><a href="#" onclick="logout();return false;"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a></div>
  </aside>

  <main class="dash-main">
    <h3 class="fw-bold">Mi rutina</h3>
    <p class="text-secondary">Aquí puedes ver tu rutina asignada por tu entrenador</p>

    <div class="gf-card mb-3">
      <h5 class="fw-bold mb-3"><i class="bi bi-clipboard-check gf-red"></i> Rutina asignada</h5>
      <div id="rutinaBox" class="routine-block text-secondary">Cargando...</div>
    </div>

    <div class="gf-card">
      <h6 class="fw-bold mb-3"><i class="bi bi-chat-left-quote gf-red"></i> Observaciones de tu entrenador</h6>
      <div id="obsBox" class="observation-block text-light">—</div>
      <small class="text-secondary d-block mt-3" id="meta"></small>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
(async () => {
  const u = await requireRole('cliente');
  if (!u) return;
  document.getElementById('meName').textContent = u.nombre;

  try {
    const r = await api('rutinas.php');
    if (r.rutina) {
      document.getElementById('rutinaBox').textContent = r.rutina.contenido;
      document.getElementById('obsBox').textContent = r.rutina.observaciones || 'Sin observaciones';
      const fecha = new Date(r.rutina.asignada_en).toLocaleDateString();
      document.getElementById('meta').textContent = `Asignada el ${fecha} por ${r.rutina.entrenador_nombre}`;
    } else {
      document.getElementById('rutinaBox').textContent = 'Aún no tienes una rutina asignada. Contacta a tu entrenador.';
    }
  } catch(e){ toast(e.message, 'error'); }
})();
</script>
</body>
</html>
